    <style>
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 15px;
        }

        .radio-option input[type="radio"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            position: relative;
        }

        .radio-option input[type="radio"]:checked {
            border-color: var(--primary);
        }

        .radio-option input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
        }

        .preview-box {
            background: rgba(255,255,255,.03);
            border: 1px dashed var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            text-align: left;
        }

        .preview-avatar {
            width: 60px;
            height: 60px;
            background: var(--primary);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 24px;
            flex-shrink: 0;
        }

        .preview-url {
            color: var(--primary);
            font-weight: 700;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div id="app-wrapper">
    
    <!-- Loader -->
    <div id="loader-overlay">Loading Profile...</div>

    <!-- Error Screen (404) -->
    <div id="error-screen">
        <h1 style="font-size: 48px; margin-bottom: 10px; color: #ff4d4d;">404</h1>
        <p style="font-size: 18px; margin-bottom: 20px; color: rgba(255,255,255,0.7);">Model not found or inactive.</p>
        <a href="/" style="padding: 12px 24px; background: var(--theme, #00D632); color: #000; text-decoration: none; border-radius: 999px; font-weight: 700;">Go Home</a>
    </div>

    <!-- STEP 1: KEYPAD -->
    <div id="step1" style="display: none; flex-direction: column; flex: 1; height: 100%;">
        <div class="topbar">
            <div class="topbar-name" id="model-name">...</div>
            <div class="topbar-avatar" id="avatar-text">?</div>
        </div>

        <div class="amount-display">
            <div class="amount-text" id="amountDisplay">$0</div>
        </div>

        <div class="keypad-section">
            <div class="keypad">
                <button class="key" data-key="1">1</button>
                <button class="key" data-key="2">2</button>
                <button class="key" data-key="3">3</button>
                <button class="key" data-key="4">4</button>
                <button class="key" data-key="5">5</button>
                <button class="key" data-key="6">6</button>
                <button class="key" data-key="7">7</button>
                <button class="key" data-key="8">8</button>
                <button class="key" data-key="9">9</button>
                <button class="key" data-key=".">.</button>
                <button class="key" data-key="0">0</button>
                <button class="key key-backspace" data-key="back">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
                </button>
            </div>
        </div>

        <div class="action-section">
            <button class="pay-btn" id="payBtn">
                <div class="btn-spinner"></div>
                <span id="payBtnText">Pay</span>
            </button>
        </div>

        <div class="bottom-nav">
            <div class="bnav-left"><span class="bnav-amount" id="navAmount">$0</span></div>
            <div class="bnav-center">$</div>
            <div class="bnav-right"><div class="bnav-clock"></div></div>
        </div>
    </div>

    <!-- STEP 2: QR SCANNER -->
    <div id="step2">
        <div class="s2-topbar">
            <button class="icon-btn" id="cancelBtn">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="scanner-title">Scan a Bitcoin or<br>Lightning QR code</div>
        <div class="qr-container">
            <div class="awaiting-text">Awaiting payment...</div>
            <a id="qrLink" href="#" target="_blank">
                <div class="qr-outer-frame">
                    <div id="qrcode"></div>
                    <div class="qr-logo"><div class="qr-logo-inner">$</div></div>
                </div>
            </a>
            <div class="info-card">★ Pay using Cash App Balance directly. No need to buy crypto.</div>
        </div>
        <div class="action-footer">
            <button id="copyBtn" class="pill-btn btn-copy">Copy address</button>
            <button id="openCashAppBtn" class="pill-btn btn-pay">Pay now</button>
        </div>
    </div>

    <!-- STEP 3: SUCCESS -->
    <div id="step3">
        <div class="success-icon">
            <svg width="44" height="44" fill="none" stroke="#000" stroke-width="3" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <div class="success-title">Payment Received!</div>
        <div class="success-amount" id="successAmount">$0.00</div>
        <button class="pill-btn btn-pay" style="max-width: 340px;" id="doneBtn">Done</button>
    </div>

</div>

<!-- Logic -->
<script type="module" src="assets/js/model.js"></script>

</body>
