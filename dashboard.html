<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Config File (Contains Keys) -->
<script src="assets/js/config.js"></script>

<style>
/* ====== EXACT MATCH DARK THEME FROM YOUR IMAGE ====== */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'DM Sans',sans-serif; background:#050505; color:#fff; min-height:100vh; padding-bottom: 40px; }

/* Header */
.header { display:flex; align-items:center; justify-content:space-between; padding:20px; position:sticky; top:0; background:rgba(5,5,5,0.9); backdrop-filter:blur(10px); z-index:100; border-bottom:1px solid rgba(255,255,255,0.05); }
.header-left { display:flex; align-items:center; gap:12px; }
.logo-icon { width:40px; height:40px; background:#00D632; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; color:#000; box-shadow:0 0 15px rgba(0,214,50,0.4); }
.header-title { font-size:18px; font-weight:800; letter-spacing:-0.5px; }
.header-sub { font-size:12px; color:rgba(255,255,255,0.4); font-weight:500; }
.btn-logout { background:transparent; border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.7); padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s; font-family:'DM Sans'; }
.btn-logout:active { background:rgba(255,255,255,0.05); transform:scale(0.95); }

.content { padding:0 20px; max-width:800px; margin:0 auto; }

/* Grid Cards */
.stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:15px; margin-top:10px; margin-bottom:20px; }
.stat-card { background:#111; border:1px solid rgba(255,255,255,0.05); border-radius:16px; padding:20px; position:relative; overflow:hidden; }
.stat-card.glow-green { background:radial-gradient(circle at top right, rgba(0,214,50,0.08) 0%, #111 70%); border-color:rgba(0,214,50,0.15); }
.stat-icon { font-size:22px; margin-bottom:12px; }
.stat-label { font-size:10px; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:1px; font-weight:700; margin-bottom:8px; }
.stat-val { font-size:28px; font-weight:800; letter-spacing:-1px; line-height:1; }
.val-green { color:#00D632; }
.val-yellow { color:#ffc800; }
.val-red { color:#ff5050; }
.stat-sub { font-size:11px; color:rgba(255,255,255,0.3); margin-top:8px; font-weight:500; }

/* Tabs & Action Buttons */
.tabs-container { display:flex; gap:10px; margin-bottom:15px; }
.tab-btn { flex:1; background:#111; border:1px solid rgba(255,255,255,0.05); color:rgba(255,255,255,0.5); padding:14px; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; font-family:'DM Sans'; display:flex; align-items:center; justify-content:center; gap:8px; transition:all 0.2s; }
.tab-btn.active { background:rgba(0,214,50,0.05); border-color:rgba(0,214,50,0.3); color:#00D632; }

.refresh-wrap { margin-bottom:20px; display:inline-block; }
.btn-refresh { background:rgba(0,214,50,0.05); border:1px solid rgba(0,214,50,0.3); color:#00D632; padding:10px 20px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px; font-family:'DM Sans'; }
.btn-refresh:active { background:rgba(0,214,50,0.15); }

/* Main Content Box */
.data-box { background:#111; border:1px solid rgba(255,255,255,0.05); border-radius:20px; padding:20px; min-height:200px; margin-bottom:30px; }

/* Copy Links Section */
.link-scroll { display:flex; gap:12px; overflow-x:auto; padding-bottom:10px; margin-bottom:20px; }
.link-scroll::-webkit-scrollbar { height:0; display:none; }
.link-card { background:#1a1a1a; border:1px solid rgba(255,255,255,0.08); padding:16px; border-radius:14px; min-width:260px; flex-shrink:0; display:flex; justify-content:space-between; align-items:center; }
.link-title { font-size:12px; font-weight:700; color:rgba(255,255,255,0.4); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; }
.link-url { font-size:13px; font-family:monospace; color:#00D632; overflow:hidden; text-overflow:ellipsis; max-width:160px; white-space:nowrap; }
.btn-copy { background:#222; border:none; color:#fff; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; }
.btn-copy:active { background:#333; }

/* List Items */
.list-item { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
.list-item:last-child { border-bottom:none; padding-bottom:0; }
.list-left { display:flex; flex-direction:column; gap:6px; }
.list-title { font-size:14px; font-weight:700; color:#fff; }
.list-sub { font-size:12px; color:rgba(255,255,255,0.4); }
.list-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.list-amount { font-size:16px; font-weight:800; }
.badge { padding:4px 10px; border-radius:6px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; }
.badge-paid { background:rgba(0,214,50,0.15); color:#00D632; }
.badge-pending { background:rgba(255,200,0,0.15); color:#ffc800; }
.badge-method { background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.8); }

/* Withdraw Form */
.w-form { display:flex; flex-direction:column; gap:12px; }
.w-input { background:#1a1a1a; border:1px solid rgba(255,255,255,0.1); color:#fff; padding:14px 16px; border-radius:12px; font-family:'DM Sans'; font-size:14px; outline:none; }
.w-input:focus { border-color:#00D632; }
.btn-submit { background:#00D632; color:#000; border:none; padding:16px; border-radius:12px; font-weight:800; font-size:15px; cursor:pointer; font-family:'DM Sans'; margin-top:5px; }
.btn-submit:active { transform:scale(0.98); }
.empty-state { text-align:center; padding:30px 10px; color:rgba(255,255,255,0.3); font-size:14px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-icon">$</div>
    <div>
      <div class="header-title">Creator Hub</div>
      <div class="header-sub" id="userEmailDisplay">Loading...</div>
    </div>
  </div>
  <button class="btn-logout" onclick="logoutUser()">Logout</button>
</div>

<div class="content">

  <div class="stats-grid">
    <div class="stat-card glow-green">
      <div class="stat-icon">💰</div>
      <div class="stat-label">Total Earned</div>
      <div class="stat-val val-green" id="statEarned">$0.00</div>
      <div class="stat-sub" id="statEarnedCount">0 payments</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🏦</div>
      <div class="stat-label">Available Balance</div>
      <div class="stat-val val-green" id="statAvailable">$0.00</div>
      <div class="stat-sub">Ready to withdraw</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">⏳</div>
      <div class="stat-label">Pending Payments</div>
      <div class="stat-val val-yellow" id="statPending">0</div>
      <div class="stat-sub">Awaiting confirmation</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">💸</div>
      <div class="stat-label">Total Withdrawn</div>
      <div class="stat-val val-red" id="statWithdrawn">$0.00</div>
      <div class="stat-sub" id="statWdCount">0 pending requests</div>
    </div>
  </div>

  <div class="tabs-container">
    <button class="tab-btn active" onclick="switchTab('income', this)">💳 My Income</button>
    <button class="tab-btn" onclick="switchTab('cashout', this)">💸 Cashout</button>
  </div>

  <div class="refresh-wrap">
    <button class="btn-refresh" onclick="loadData()">⟳ Refresh Data</button>
  </div>

  <!-- INCOME TAB -->
  <div id="tab-income">
    <!-- Links Scroll -->
    <div style="font-size:12px; font-weight:700; color:rgba(255,255,255,0.4); margin-bottom:10px; text-transform:uppercase; letter-spacing:1px;">Your Payment Links</div>
    <div class="link-scroll" id="modelLinksContainer">
      <div class="empty-state">Loading links...</div>
    </div>

    <!-- Payments List -->
    <div class="data-box" id="paymentsList">
      <div class="empty-state">Loading transactions...</div>
    </div>
  </div>

  <!-- CASHOUT TAB -->
  <div id="tab-cashout" style="display:none;">
    <div class="data-box" style="margin-bottom:15px;">
      <div style="font-size:16px; font-weight:700; margin-bottom:15px;">Request Withdrawal</div>
      <div class="w-form">
        <input type="number" id="wdAmount" class="w-input" placeholder="Amount (Min $5)" min="5">
        <select id="wdMethod" class="w-input">
          <option value="bKash">bKash</option>
          <option value="Nagad">Nagad</option>
          <option value="Binance">Binance (USDT/BTC)</option>
          <option value="Bank">Bank Transfer</option>
        </select>
        <input type="text" id="wdNote" class="w-input" placeholder="Account Number / Wallet Address">
        <button class="btn-submit" onclick="submitWithdrawal()">Submit Request</button>
      </div>
    </div>

    <div class="data-box" id="withdrawalsList">
      <div class="empty-state">Loading history...</div>
    </div>
  </div>

</div>

<script>
let currentUser = null;
let allPayments = [];
let allWithdrawals = [];

document.addEventListener("DOMContentLoaded", async () => {
  if (!window.newSupabase || !window.oldSupabase) {
      alert("Database connection failed. Check config.js");
      return;
  }

  const { data: { session } } = await window.newSupabase.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }
  
  currentUser = session.user;
  document.getElementById('userEmailDisplay').textContent = currentUser.email;
  
  loadData();
});

async function logoutUser() {
  await window.newSupabase.auth.signOut();
  window.location.href = 'login.html';
}

async function loadData() {
  await Promise.all([fetchModels(), fetchPayments(), fetchWithdrawals()]);
  calculateStats();
  renderPayments();
  renderWithdrawals();
}

// 🟢 NEW DB: Fetch Models & Generate Custom Tracked Links
async function fetchModels() {
  const { data, error } = await window.newSupabase.from('models').select('*').eq('owner_id', currentUser.id);
  const container = document.getElementById('modelLinksContainer');
  
  if (error || !data || data.length === 0) {
    container.innerHTML = `<div class="empty-state">No models assigned yet. Contact admin.</div>`;
    return;
  }

  container.innerHTML = data.map(m => {
    // 🟢 Magic Link with Tracking ID 🟢
    const link = `https://cpay-cash.app/${m.slug}?ref=${currentUser.id}`;
    return `
      <div class="link-card">
        <div>
          <div class="link-title">${m.model_name}</div>
          <div class="link-url">${link}</div>
        </div>
        <button class="btn-copy" onclick="copyToClipboard('${link}')">📋</button>
      </div>
    `;
  }).join('');
}

// 🔴 OLD DB: Fetch Payments using the Tracking ID
async function fetchPayments() {
  const { data, error } = await window.oldSupabase
    .from('payments')
    .select('*')
    .eq('member_id', currentUser.id) // Only fetch payments that matched this user's ref ID
    .order('created_at', { ascending: false });
    
  if (!error && data) allPayments = data;
}

// 🟢 NEW DB: Fetch Withdrawals
async function fetchWithdrawals() {
  const { data, error } = await window.newSupabase
    .from('withdrawals')
    .select('*')
    .eq('owner_id', currentUser.id)
    .order('created_at', { ascending: false });
    
  if (!error && data) allWithdrawals = data;
}

function calculateStats() {
  let earned = 0, earnedCount = 0, pending = 0;
  allPayments.forEach(p => {
    if (p.status === 'settled' || p.status === 'paid' || p.status === 'completed') {
      earned += parseFloat(p.amount || 0); earnedCount++;
    } else if (p.status === 'pending' || p.status === 'new') {
      pending += parseFloat(p.amount || 0); // Displaying pending dollar amount
    }
  });

  let withdrawn = 0, wdPendingCount = 0;
  allWithdrawals.forEach(w => {
    withdrawn += parseFloat(w.amount || 0); 
    if (w.status === 'pending') wdPendingCount++;
  });

  const available = earned - withdrawn;

  document.getElementById('statEarned').textContent = '$' + earned.toFixed(2);
  document.getElementById('statEarnedCount').textContent = earnedCount + ' payments';
  document.getElementById('statPending').textContent = '$' + pending.toFixed(2);
  document.getElementById('statAvailable').textContent = '$' + Math.max(0, available).toFixed(2);
  document.getElementById('statWithdrawn').textContent = '$' + withdrawn.toFixed(2);
  document.getElementById('statWdCount').textContent = wdPendingCount + ' pending requests';
}

function renderPayments() {
  const container = document.getElementById('paymentsList');
  if (!allPayments.length) { container.innerHTML = '<div class="empty-state">No payment records found</div>'; return; }

  container.innerHTML = allPayments.map(p => {
    const isPaid = (p.status === 'settled' || p.status === 'paid' || p.status === 'completed');
    const method = p.payment_type ? p.payment_type.toUpperCase() : 'CRYPTO';
    return `
      <div class="list-item">
        <div class="list-left">
          <div class="list-title">Payment Received</div>
          <div style="display:flex; gap:6px; margin-top:4px;">
            <span class="badge badge-method">${method}</span>
            <span class="list-sub">${new Date(p.created_at).toLocaleDateString()}</span>
          </div>
        </div>
        <div class="list-right">
          <div class="list-amount" style="color:#00D632;">+$${parseFloat(p.amount||0).toFixed(2)}</div>
          <span class="badge ${isPaid ? 'badge-paid' : 'badge-pending'}">${isPaid ? 'Settled' : 'Pending'}</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderWithdrawals() {
  const container = document.getElementById('withdrawalsList');
  if (!allWithdrawals.length) { container.innerHTML = '<div class="empty-state">No withdrawal history</div>'; return; }

  container.innerHTML = allWithdrawals.map(w => {
    const isPaid = w.status === 'completed';
    return `
      <div class="list-item">
        <div class="list-left">
          <div class="list-title">Cashout (${w.method})</div>
          <div class="list-sub">${w.note || 'Bank Transfer'}</div>
          <div class="list-sub" style="margin-top:2px;">${new Date(w.created_at).toLocaleDateString()}</div>
        </div>
        <div class="list-right">
          <div class="list-amount" style="color:#ff5050;">-$${parseFloat(w.amount||0).toFixed(2)}</div>
          <span class="badge ${isPaid ? 'badge-paid' : 'badge-pending'}">${isPaid ? 'Paid' : 'Pending'}</span>
        </div>
      </div>
    `;
  }).join('');
}

async function submitWithdrawal() {
  const amt = parseFloat(document.getElementById('wdAmount').value);
  const method = document.getElementById('wdMethod').value;
  const note = document.getElementById('wdNote').value.trim();
  const available = parseFloat(document.getElementById('statAvailable').textContent.replace('$', ''));

  if (!amt || amt < 5) return alert("Minimum withdrawal is $5");
  if (!note) return alert("Please enter account details");
  if (amt > available) return alert("Insufficient balance!");

  const { error } = await window.newSupabase.from('withdrawals').insert({
    owner_id: currentUser.id, amount: amt, method: method, note: note, status: 'pending'
  });

  if (error) alert("Error: " + error.message);
  else {
    alert("Cashout request submitted!");
    document.getElementById('wdAmount').value = '';
    document.getElementById('wdNote').value = '';
    loadData();
  }
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-income').style.display = tab==='income' ? 'block' : 'none';
  document.getElementById('tab-cashout').style.display = tab==='cashout' ? 'block' : 'none';
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text);
  alert("Link copied successfully!");
}
</script>
</body>
</html>
