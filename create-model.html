<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Model - Secure Gateway</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 15px;
        }
        .radio-option input[type="radio"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            position: relative;
        }
        .radio-option input[type="radio"]:checked {
            border-color: var(--primary);
        }
        .radio-option input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
        }
        .preview-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            text-align: left;
        }
        .preview-avatar {
            width: 60px;
            height: 60px;
            background: var(--primary);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 24px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 40px;">
            <h2 style="font-size: 24px;">Create New Model</h2>
            <a href="dashboard.html" class="btn btn-outline" style="width: auto; padding: 8px 20px; border-radius: 8px;">Back to Dashboard</a>
        </header>

        <!-- Main Form -->
        <div class="auth-box" style="max-width: 600px; padding: 40px;">
            <form id="model-form">
                
                <div class="input-group">
                    <label for="modelName">Model Name</label>
                    <input type="text" id="modelName" placeholder="e.g. Cute Queen" required autocomplete="off">
                </div>

                <div class="input-group mt-4">
                    <label>Link Style</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="slugStyle" value="dash" checked>
                            Dash (cute-queen)
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="slugStyle" value="flat">
                            Flat (cutequeen)
                        </label>
                    </div>
                </div>

                <!-- Live Auto Generate Preview -->
                <div class="preview-box">
                    <div class="preview-avatar" id="previewAvatar">?</div>
                    <div style="overflow: hidden;">
                        <h3 id="previewName" style="font-size: 20px; margin-bottom: 4px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">Model Name</h3>
                        <p style="font-size: 14px; color: var(--text-muted); word-break: break-all;">
                            pay-cashapp.buzz/<span id="previewSlug" style="color: var(--primary); font-weight: 700;">link</span>
                        </p>
                    </div>
                </div>

                <button type="submit" class="btn mt-4" id="submit-btn" style="margin-top: 30px;">Create Model</button>
            </form>
            
            <div id="msg" class="msg"></div>
        </div>
    </div>

    <!-- Script loaded as module -->
    <script type="module" src="assets/js/create-model.js"></script>
</body>
</html>
